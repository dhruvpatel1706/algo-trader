[project]
name = "algo-trader"
version = "0.1.0"
description = "Paper-first algorithmic trading system (Alpaca paper, two strategies, dashboard)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Operator" }]

dependencies = [
  # Config
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  # Broker
  "alpaca-py>=0.33",
  # Data
  "pandas>=2.0,<2.3",
  "polars>=1.13",
  "pyarrow>=18.0",
  "numpy>=1.26,<2.0",
  "ta>=0.11.0",
  "yfinance>=0.2.49",
  # Backtest
  "vectorbt>=0.26",
  "matplotlib>=3.9",
  # Infra
  "redis>=5.2",
  "httpx>=0.27",
  "python-ulid>=3.0",
  "tenacity>=9.0",
  # Logging / metrics
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "rich>=13.9",
  # Dashboard backend
  "fastapi>=0.116",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "websockets>=13.1",
  # DB
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "alembic>=1.14",
  "greenlet>=3.0",
  "lightgbm>=4.6.0",
  "scikit-learn>=1.8.0",
  "apscheduler>=3.10",
  "fakeredis>=2.24",
  # XXE-hardened XML parser for SEC EDGAR ingestion.
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "freezegun>=1.5",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.100",
  # Bug hunter — security + dead-code analyzers (used by scripts/bug_hunt.py).
  "bandit>=1.7",
  "vulture>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "dashboard/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "PL", "RUF", "S", "ASYNC"]
# S104: binding to 0.0.0.0 is intentional for the dev dashboard; document in OPERATIONS.md.
# PLR0911: risk/limits uses a guard pattern with one return per check; that is the design.
ignore = ["S101", "PLR0913", "PLR2004", "S311", "PLR0911", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S105", "S106", "PLR2004", "S311", "PLR0915",
  # Test fixtures often import after monkeypatch / inside test bodies.
  "PLC0415",
  # Tests legitimately use subprocess.run without `check=` for assertion-driven flows.
  "S603", "PLW1510",
]
"scripts/**" = ["T201", "S603", "S607", "PLC0415", "S110", "PLR0915", "PLR0912", "E501", "RUF001", "RUF059"]
# Lazy imports here are intentional defensive fallbacks (alpaca/yfinance/anthropic optional at import time).
"src/execution/broker.py" = ["PLC0415"]
"src/data/loader.py" = ["PLC0415"]
"src/moonshot/llm_discretionary.py" = ["PLC0415"]
# CLI script: hardcoded `git` invocation is safe (no user input).
"src/backtest/cli.py" = ["S603", "S607"]
# Sklearn / ML convention: capital `X` for the design matrix is universal — fighting it
# would diverge from every published ML reference. Tests and production both use it.
"src/ml/**" = ["N803", "N806"]
"tests/unit/ml/**" = ["N803", "N806"]
# FastAPI uses Query()/Depends() in arg defaults idiomatically.
"dashboard/api/main.py" = ["B008"]
# multi_agent.py defensively imports optional alt-data deps inside request handlers
# so a missing module never breaks endpoints that don't use it.
"dashboard/api/multi_agent.py" = ["PLC0415"]
# Singletons + lazy alpaca imports inside dashboard helpers are intentional.
"dashboard/api/broker_proxy.py" = ["PLC0415", "PLW0603"]
"dashboard/api/state.py" = ["PLW0603"]
# Module-level singleton supervisor + adopt-orphan recovery use a global.
"dashboard/api/runner_control.py" = ["PLW0603"]
# LLM router: lazy provider SDK imports are deliberate (one missing SDK must
# not break callers that route to other providers); the leading-underscore
# exception classes are private taxonomy not exposed in the public API; the
# multiplication-sign typography in the docstring is intentional.
"src/llm/router.py" = ["PLC0415", "PLW0603", "N818", "RUF002"]
# Integration tests legitimately shell out via subprocess.
"tests/integration/**" = ["S603", "S607", "PLW1510"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: integration tests (deselect with '-m \"not integration\"')",
  "broker: requires paper broker connection",
  "network: hits the network (yfinance, etc.)",
  "property: hypothesis property-based tests (slow, deselect with '-m \"not property\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "src/agents/*",
  "src/data/*",
  "src/__init__.py",
  "src/backtest/cli.py",       # CLI script; tested via integration in CI
  "src/strategies/__init__.py", # registry
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
