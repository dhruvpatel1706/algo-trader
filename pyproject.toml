[project]
name = "algo-trader"
version = "0.1.0"
description = "Paper-first algorithmic trading system (Alpaca paper, two strategies, dashboard)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Operator" }]

dependencies = [
  # Config
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  # Broker
  "alpaca-py>=0.33",
  # Data
  "pandas>=2.0,<2.3",
  "polars>=1.13",
  "pyarrow>=18.0",
  "numpy>=1.26,<2.0",
  "ta>=0.11.0",
  "yfinance>=0.2.49",
  # Backtest
  "vectorbt>=0.26",
  # Infra
  "redis>=5.2",
  "httpx>=0.27",
  "python-ulid>=3.0",
  "tenacity>=9.0",
  # Logging / metrics
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "rich>=13.9",
  # Dashboard backend
  "fastapi>=0.116",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "websockets>=13.1",
  # DB
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "alembic>=1.14",
  "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "freezegun>=1.5",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "dashboard/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "PL", "RUF", "S", "ASYNC"]
ignore = ["S101", "PLR0913", "PLR2004", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004", "S311", "PLR0915"]
"scripts/**" = ["T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: integration tests (deselect with '-m \"not integration\"')",
  "broker: requires paper broker connection",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/agents/*", "src/data/*", "src/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
