[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "signal-engine-native"
version = "0.1.0"
description = "Rust hot-path indicator engine for algo-trader. Optional acceleration; pure-Python fallback is the default."
readme = "../../docs/performance.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[tool.maturin]
features = ["python"]
module-name = "signal_engine_native._signal_engine"
python-source = "python"
