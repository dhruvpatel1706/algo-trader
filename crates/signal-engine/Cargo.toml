[package]
name = "signal-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# `_signal_engine` so the Python import is `signal_engine_native._signal_engine`
# but we can re-export it cleanly from a thin Python wrapper.
name = "_signal_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true }
numpy = { workspace = true }
ndarray = { workspace = true }

[features]
# Default = Python extension. Disable when used from another Rust crate.
default = ["python"]
python = []
# Release-profile flags live at the workspace root in `crates/Cargo.toml`.
