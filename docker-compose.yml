services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: algo-trader-postgres
    environment:
      POSTGRES_DB: algotrader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
    ports:
      # Host 5433 → container 5432. Avoids clashing with a host Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d algotrader"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: algo-trader-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
