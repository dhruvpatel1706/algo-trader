# Universe definitions for backtests + sweeps.
#
# These are CURATED lists. They are not survivorship-bias-free:
#   - The "liquid ETFs" list reflects names that have been consistently top-AUM
#     for years; survivorship is mild but real (failed niche ETFs are absent).
#   - The "large_caps_50" list is roughly the S&P 500 top market caps as of
#     early 2022. Some of these dropped out of the top 50 by late 2024; some
#     names that climbed in (like LLY) are included. For paper-grade results,
#     swap to point-in-time index constituents.
#
# Update this file rather than hard-coding lists in scripts.

spy_qqq:
  - SPY
  - QQQ

liquid_etfs_top20:
  - SPY     # S&P 500
  - QQQ     # Nasdaq 100
  - IWM     # Russell 2000
  - IVV     # S&P 500 (iShares)
  - VOO     # S&P 500 (Vanguard)
  - VTI     # Total US market
  - EFA     # MSCI EAFE
  - EEM     # MSCI emerging markets
  - AGG     # Aggregate bond
  - BND     # Total bond
  - GLD     # Gold
  - SLV     # Silver
  - XLF     # Financials sector
  - XLK     # Technology sector
  - XLE     # Energy sector
  - XLV     # Healthcare sector
  - XLY     # Consumer discretionary sector
  - XLP     # Consumer staples sector
  - TLT     # 20+ year Treasury
  - HYG     # High-yield corporate bond

gold:
  - GLD     # SPDR Gold ETF — equity proxy, broker-tradeable on Alpaca
  - IAU     # iShares Gold Trust — alternative ETF
  - GDX     # VanEck Gold Miners ETF — beta-amplified gold exposure

silver:
  - SLV     # iShares Silver Trust — main ETF
  - SIVR    # abrdn Physical Silver Shares
  - SIL     # Global X Silver Miners ETF
  - PSLV    # Sprott Physical Silver Trust

bonds:
  - TLT     # 20+ year Treasury
  - IEF     # 7-10 year Treasury
  - SHY     # 1-3 year Treasury
  - AGG     # Aggregate bond
  - BND     # Total bond
  - HYG     # High-yield corporate bond
  - LQD     # Investment-grade corporate bond

crypto_majors:
  # Eleven actively-quoted USD pairs verified live on Alpaca's crypto data API
  # (paper tier). Listed by descending liquidity. Symbols use the Binance-style
  # USDT suffix as our internal canonical form; the loader normalises to
  # Alpaca's `XYZ/USD` shape via _normalize_crypto_symbol_alpaca().
  #
  # Excluded on purpose: MATIC, SHIB, MKR — Alpaca's quote endpoint returns
  # $0.00 mids for these on the paper tier, which would corrupt sizing math.
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - AVAXUSDT
  - LINKUSDT
  - LTCUSDT
  - BCHUSDT
  - XRPUSDT
  - DOGEUSDT
  - AAVEUSDT
  - UNIUSDT

# Symbols flagged as broad-market index ETFs. Used by survivorship-bias check
# in src/backtest/cli.py and the universe.is_index_etf() helper.
index_etfs:
  - SPY
  - QQQ
  - IWM
  - DIA
  - IVV
  - VOO
  - VTI

# Per-strategy universe assignment. A strategy reads
# Universe.for_strategy(self.name) and gets the list keyed here. Default is
# `spy_qqq` if a strategy is not listed.
strategy_universes:
  mr_etf: spy_qqq
  wheel_etf: spy_qqq
  failed_breakout: liquid_etfs_top20
  ma_pullback_trend: large_caps_50
  range_shift_pullback: liquid_etfs_top20
  momentum_xs: large_caps_50
  failed_breakout_gold: gold
  ma_pullback_trend_gold: gold
  silver_agent: silver
  ma_pullback_trend_bonds: bonds
  failed_breakout_crypto: crypto_majors
  ma_pullback_trend_crypto: crypto_majors
  ema_ribbon_compression: crypto_majors
  funding_rate_divergence: crypto_majors

